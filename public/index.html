<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebtTrack - Borrower & Payment Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Header Navigation Bar -->
    <nav class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wallet text-2xl text-indigo-200"></i>
                <h1 class="text-2xl font-bold tracking-tight">DebtTrack</h1>
            </div>
            <span class="text-xs bg-indigo-800 text-indigo-200 px-3 py-1 rounded-full font-semibold uppercase tracking-wider">
                Production Ready
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Summary Statistics Grid -->
        <div id="statsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Stats cards will render here dynamically -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 col-span-full text-center text-slate-400">
                <i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Loading metrics...
            </div>
        </div>

        <!-- Loans Table Card -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Borrowers & Active Loans</h2>
                    <p class="text-xs text-slate-500">Manage active obligations and send manual payment reminders</p>
                </div>
                <button onclick="loadDashboard()" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 transition">
                    <i class="fa-solid fa-rotate-right text-xs"></i> Refresh
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold uppercase text-xs tracking-wider">
                            <th class="py-3 px-4">Borrower</th>
                            <th class="py-3 px-4">Phone</th>
                            <th class="py-3 px-4">Principal</th>
                            <th class="py-3 px-4">Due Date</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="loanTableBody" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="6" class="py-8 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch animate-spin mr-2"></i> Loading records...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Borrower Detail Modal -->
    <div id="borrowerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100 transform transition-all">
            <div class="bg-slate-50 p-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-indigo-600"></i>
                    Borrower Details
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-5 space-y-3 text-sm">
                <div class="flex justify-between py-1 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">Borrower Name</span>
                    <span id="modalName" class="font-semibold text-slate-800"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">Phone Number</span>
                    <span id="modalPhone" class="font-semibold text-slate-800"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">Email Address</span>
                    <span id="modalEmail" class="font-semibold text-slate-800"></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">Principal Loan</span>
                    <span class="font-semibold text-slate-800">₱<span id="modalAmount"></span></span>
                </div>
                <div class="flex justify-between py-1 border-b border-slate-100">
                    <span class="text-slate-500 font-medium">Due Date</span>
                    <span id="modalDueDate" class="font-semibold text-slate-800"></span>
                </div>

                <!-- Custom Manual Reminder Trigger Controls -->
                <div class="mt-4 p-4 bg-indigo-50/60 border border-indigo-100 rounded-lg space-y-2">
                    <label class="block text-xs font-bold text-indigo-900 uppercase tracking-wide">
                        <i class="fa-solid fa-paper-plane mr-1 text-indigo-600"></i> Dispatch Custom Reminder
                    </label>
                    <div class="flex gap-2">
                        <select id="reminderChannel" class="bg-white border border-slate-300 text-slate-700 text-xs rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none flex-grow">
                            <option value="both">Both (SMS & Email)</option>
                            <option value="sms">SMS Only</option>
                            <option value="email">Email Only</option>
                        </select>
                        <button type="button" onclick="triggerManualReminder()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-sm">
                            Send
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 text-right">
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedLoanId = null;

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();

                // Render Tailored Summary Cards
                document.getElementById('statsGrid').innerHTML = `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Borrowers</p>
                        <p class="text-2xl font-bold text-slate-800 mt-1">${data.stats.totalBorrowers}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Capital Lent</p>
                        <p class="text-2xl font-bold text-indigo-600 mt-1">₱${data.stats.totalCapitalLent.toLocaleString()}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Loans</p>
                        <p class="text-2xl font-bold text-blue-600 mt-1">${data.stats.activeCount}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Due Today</p>
                        <p class="text-2xl font-bold text-amber-500 mt-1">${data.stats.dueTodayCount}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Overdue</p>
                        <p class="text-2xl font-bold text-rose-600 mt-1">${data.stats.overdueCount}</p>
                    </div>
                `;

                // Status Badge Helper
                const getBadge = (status) => {
                    if (status === 'Overdue') return `<span class="bg-rose-100 text-rose-700 font-semibold px-2.5 py-1 rounded-full text-xs">Overdue</span>`;
                    if (status === 'Due Today') return `<span class="bg-amber-100 text-amber-700 font-semibold px-2.5 py-1 rounded-full text-xs">Due Today</span>`;
                    if (status === 'Paid') return `<span class="bg-emerald-100 text-emerald-700 font-semibold px-2.5 py-1 rounded-full text-xs">Paid</span>`;
                    return `<span class="bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full text-xs">Active</span>`;
                };

                // Render Styled Table Rows
                const tbody = document.getElementById('loanTableBody');
                if (data.loans.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">No active loans found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.loans.map(loan => `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-4 font-semibold text-slate-800">${loan.borrowers.name}</td>
                        <td class="py-3 px-4 text-slate-600">${loan.borrowers.phone || '<span class="text-slate-300">N/A</span>'}</td>
                        <td class="py-3 px-4 font-semibold text-slate-700">₱${parseFloat(loan.principal_amount).toLocaleString()}</td>
                        <td class="py-3 px-4 text-slate-600">${loan.due_date}</td>
                        <td class="py-3 px-4">${getBadge(loan.status)}</td>
                        <td class="py-3 px-4 text-right space-x-1">
                            <button 
                                onclick="openModal('${loan.id}', '${loan.borrowers.name}', '${loan.borrowers.phone || ''}', '${loan.borrowers.email || ''}', '${loan.principal_amount}', '${loan.due_date}')"
                                class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-3 rounded-lg text-xs transition border border-slate-200"
                            >
                                <i class="fa-solid fa-eye mr-1"></i> View
                            </button>
                            <button 
                                onclick="quickRemind('${loan.id}', '${loan.borrowers.name}')"
                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-1.5 px-3 rounded-lg text-xs transition shadow-sm"
                            >
                                <i class="fa-solid fa-bolt mr-1"></i> Remind
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Dashboard load error:", err);
            }
        }

        function openModal(loanId, name, phone, email, amount, dueDate) {
            selectedLoanId = loanId;
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalPhone').innerText = phone || 'None';
            document.getElementById('modalEmail').innerText = email || 'None';
            document.getElementById('modalAmount').innerText = parseFloat(amount).toLocaleString();
            document.getElementById('modalDueDate').innerText = dueDate;
            
            const modal = document.getElementById('borrowerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('borrowerModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            selectedLoanId = null;
        }

        async function quickRemind(loanId, borrowerName) {
            if (!confirm(`Send immediate SMS & Email reminder to ${borrowerName}?`)) return;

            try {
                const response = await fetch(`/api/loans/${loanId}/send-reminder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel: 'both' })
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to send reminder: ${err.message}`);
            }
        }

        async function triggerManualReminder() {
            if (!selectedLoanId) return alert('No borrower selected.');
            const channel = document.getElementById('reminderChannel').value;

            try {
                const response = await fetch(`/api/loans/${selectedLoanId}/send-reminder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel })
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                } else {
                    alert(`Error: ${result.error}`);
                }
            } catch (err) {
                alert(`Failed to send reminder: ${err.message}`);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
