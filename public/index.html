<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebtTrack - Cozy Money Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FFFDF9',
                            100: '#FAF6EE',
                            200: '#F3EBDC',
                            300: '#E8DCC4',
                        },
                        cozyDark: {
                            800: '#232526',
                            900: '#1A1C1D',
                            700: '#2C2E30'
                        },
                        pastelRed: '#F87171',
                        pastelGreen: '#4ADE80',
                        pastelBlue: '#60A5FA',
                        pastelYellow: '#FBBF24',
                        pastelPurple: '#C084FC'
                    },
                    fontFamily: {
                        sans: ['Nunito', 'Comfortaa', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons & Google Nunito Font -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .cozy-card {
            box-shadow: 0 4px 20px -2px rgba(210, 190, 160, 0.25);
        }
        .dark .cozy-card {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-cream-100 dark:bg-cozyDark-900 text-slate-700 dark:text-slate-200 transition-colors duration-300 min-h-screen pb-12">

    <!-- Top Sticky Header Navigation -->
    <header class="bg-cream-50/80 dark:bg-cozyDark-800/80 backdrop-blur-md sticky top-0 z-40 border-b border-cream-200 dark:border-cozyDark-700">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl shadow-sm">
                    <i class="fa-solid fa-cat"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight leading-tight">DebtTrack</h1>
                    <p class="text-xs font-semibold text-amber-700/70 dark:text-amber-400/70">Cozy Borrower Ledger</p>
                </div>
            </div>

            <!-- Action Controls & Dark Mode Toggle -->
            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-cream-200 dark:bg-cozyDark-700 text-slate-600 dark:text-amber-300 flex items-center justify-center hover:scale-105 transition active:scale-95">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="loadDashboard()" class="w-9 h-9 rounded-xl bg-amber-200/60 dark:bg-amber-800/40 text-amber-800 dark:text-amber-200 flex items-center justify-center hover:scale-105 transition active:scale-95">
                    <i class="fa-solid fa-rotate-right text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Body -->
    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

        <!-- Top Header Stats Banner (Cozy Warm Cards) -->
        <div id="statsBanner" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="col-span-full text-center py-6 text-slate-400">
                <i class="fa-solid fa-paw animate-bounce text-2xl text-amber-400"></i>
                <p class="text-xs font-bold mt-2">Loading ledger stats...</p>
            </div>
        </div>

        <!-- Quick Ledger Summary Pill -->
        <div class="bg-cream-50 dark:bg-cozyDark-800 cozy-card p-4 rounded-3xl border border-cream-200 dark:border-cozyDark-700 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                    <i class="fa-solid fa-vault text-sm"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Total Capital Lent</span>
                    <span id="totalCapitalText" class="text-lg font-black text-slate-800 dark:text-slate-100">₱0.00</span>
                </div>
            </div>
            <button onclick="loadDashboard()" class="px-4 py-2 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold text-xs shadow-sm transition active:scale-95 flex items-center gap-1.5">
                <i class="fa-solid fa-plus text-xs"></i> New Ledger Entry
            </button>
        </div>

        <!-- Borrowers & Active Loans List -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-base font-extrabold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark text-amber-500"></i> Active Borrowers
                </h2>
                <span id="recordCount" class="text-xs font-bold text-slate-400 bg-cream-200 dark:bg-cozyDark-700 px-2.5 py-1 rounded-full">0 Records</span>
            </div>

            <div id="loanListContainer" class="space-y-3">
                <!-- Loan Cards will render dynamically here -->
                <div class="bg-cream-50 dark:bg-cozyDark-800 cozy-card p-8 rounded-3xl border border-cream-200 dark:border-cozyDark-700 text-center text-slate-400">
                    <i class="fa-solid fa-spinner animate-spin text-xl text-amber-400 mb-2"></i>
                    <p class="text-xs font-bold">Fetching records...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Borrower Detail & Custom Reminder Modal -->
    <div id="borrowerModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-cream-50 dark:bg-cozyDark-800 cozy-card rounded-3xl max-w-sm w-full overflow-hidden border border-cream-200 dark:border-cozyDark-700 transform transition-all p-6 space-y-4">
            
            <div class="flex justify-between items-center border-b border-cream-200 dark:border-cozyDark-700 pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-2xl bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <h3 class="font-extrabold text-slate-800 dark:text-slate-100">Borrower Info</h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-200 dark:bg-cozyDark-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-2.5 text-xs font-bold">
                <div class="flex justify-between p-2 rounded-xl bg-cream-100 dark:bg-cozyDark-700/50">
                    <span class="text-slate-400">Borrower Name</span>
                    <span id="modalName" class="text-slate-800 dark:text-slate-100"></span>
                </div>
                <div class="flex justify-between p-2 rounded-xl bg-cream-100 dark:bg-cozyDark-700/50">
                    <span class="text-slate-400">Phone Number</span>
                    <span id="modalPhone" class="text-slate-800 dark:text-slate-100"></span>
                </div>
                <div class="flex justify-between p-2 rounded-xl bg-cream-100 dark:bg-cozyDark-700/50">
                    <span class="text-slate-400">Email</span>
                    <span id="modalEmail" class="text-slate-800 dark:text-slate-100"></span>
                </div>
                <div class="flex justify-between p-2 rounded-xl bg-cream-100 dark:bg-cozyDark-700/50">
                    <span class="text-slate-400">Principal</span>
                    <span class="text-amber-600 dark:text-amber-400">₱<span id="modalAmount"></span></span>
                </div>
                <div class="flex justify-between p-2 rounded-xl bg-cream-100 dark:bg-cozyDark-700/50">
                    <span class="text-slate-400">Due Date</span>
                    <span id="modalDueDate" class="text-slate-800 dark:text-slate-100"></span>
                </div>

                <!-- Custom Reminder Selector -->
                <div class="pt-2">
                    <label class="block text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1.5">Dispatch Custom Reminder</label>
                    <div class="flex gap-2">
                        <select id="reminderChannel" class="bg-cream-100 dark:bg-cozyDark-700 text-slate-700 dark:text-slate-200 border-none text-xs rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-amber-400 outline-none flex-grow font-bold">
                            <option value="both">Both (SMS & Email)</option>
                            <option value="sms">SMS Only</option>
                            <option value="email">Email Only</option>
                        </select>
                        <button type="button" onclick="triggerManualReminder()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold px-4 py-2.5 rounded-xl transition shadow-sm active:scale-95">
                            Send
                        </button>
                    </div>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-cream-200 dark:bg-cozyDark-700 text-slate-600 dark:text-slate-300 font-extrabold text-xs py-2.5 rounded-xl transition">
                Close
            </button>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        let selectedLoanId = null;

        // Dark Mode Toggle Logic
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize saved theme on load
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-sun';
        }

        async function loadDashboard() {
            try {
                const res = await fetch('/api/dashboard');
                const data = await res.json();

                // Update Total Capital
                document.getElementById('totalCapitalText').innerText = `₱${data.stats.totalCapitalLent.toLocaleString()}`;
                document.getElementById('recordCount').innerText = `${data.loans.length} Records`;

                // Render Top Pastel Header Stats
                document.getElementById('statsBanner').innerHTML = `
                    <div class="bg-amber-100/70 dark:bg-amber-900/30 p-3.5 rounded-2xl border border-amber-200/60 dark:border-amber-800/40 text-amber-900 dark:text-amber-200">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-users text-amber-600 text-xs"></i>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-700/80 dark:text-amber-300/80">Borrowers</span>
                        </div>
                        <p class="text-xl font-black">${data.stats.totalBorrowers}</p>
                    </div>
                    <div class="bg-blue-100/70 dark:bg-blue-900/30 p-3.5 rounded-2xl border border-blue-200/60 dark:border-blue-800/40 text-blue-900 dark:text-blue-200">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-circle-check text-blue-600 text-xs"></i>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-blue-700/80 dark:text-blue-300/80">Active</span>
                        </div>
                        <p class="text-xl font-black">${data.stats.activeCount}</p>
                    </div>
                    <div class="bg-orange-100/70 dark:bg-orange-900/30 p-3.5 rounded-2xl border border-orange-200/60 dark:border-orange-800/40 text-orange-900 dark:text-orange-200">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-clock text-orange-600 text-xs"></i>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-orange-700/80 dark:text-orange-300/80">Due Today</span>
                        </div>
                        <p class="text-xl font-black">${data.stats.dueTodayCount}</p>
                    </div>
                    <div class="bg-rose-100/70 dark:bg-rose-900/30 p-3.5 rounded-2xl border border-rose-200/60 dark:border-rose-800/40 text-rose-900 dark:text-rose-200">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fa-solid fa-triangle-exclamation text-rose-600 text-xs"></i>
                            <span class="text-[10px] font-extrabold uppercase tracking-wider text-rose-700/80 dark:text-rose-300/80">Overdue</span>
                        </div>
                        <p class="text-xl font-black">${data.stats.overdueCount}</p>
                    </div>
                `;

                // Render Cards with Cute Icons & Status Badges
                const container = document.getElementById('loanListContainer');
                if (data.loans.length === 0) {
                    container.innerHTML = `
                        <div class="bg-cream-50 dark:bg-cozyDark-800 p-8 rounded-3xl border border-cream-200 dark:border-cozyDark-700 text-center text-slate-400">
                            <p class="text-xs font-bold">No borrower ledgers found!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.loans.map(loan => {
                    let statusBadge = `<span class="bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300 px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase">Active</span>`;
                    let iconBg = `bg-amber-100 text-amber-600 dark:bg-amber-900/40 dark:text-amber-400`;

                    if (loan.status === 'Overdue') {
                        statusBadge = `<span class="bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300 px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase">Overdue</span>`;
                        iconBg = `bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400`;
                    } else if (loan.status === 'Due Today') {
                        statusBadge = `<span class="bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300 px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase">Due Today</span>`;
                        iconBg = `bg-orange-100 text-orange-600 dark:bg-orange-900/40 dark:text-orange-400`;
                    } else if (loan.status === 'Paid') {
                        statusBadge = `<span class="bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase">Paid</span>`;
                        iconBg = `bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400`;
                    }

                    return `
                        <div class="bg-cream-50 dark:bg-cozyDark-800 cozy-card p-4 rounded-3xl border border-cream-200 dark:border-cozyDark-700 flex items-center justify-between gap-3 hover:scale-[1.01] transition">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-2xl ${iconBg} flex items-center justify-center text-lg shadow-sm flex-shrink-0">
                                    <i class="fa-solid fa-wallet"></i>
                                </div>
                                <div class="space-y-0.5">
                                    <div class="flex items-center gap-2">
                                        <h3 class="font-extrabold text-slate-800 dark:text-slate-100 text-sm">${loan.borrowers.name}</h3>
                                        ${statusBadge}
                                    </div>
                                    <p class="text-xs font-bold text-slate-400 flex items-center gap-2">
                                        <span><i class="fa-solid fa-phone text-[10px] mr-1"></i>${loan.borrowers.phone || 'N/A'}</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-calendar text-[10px] mr-1"></i>${loan.due_date}</span>
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center gap-3">
                                <div class="text-right">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Principal</span>
                                    <span class="text-sm font-black text-slate-800 dark:text-slate-100">₱${parseFloat(loan.principal_amount).toLocaleString()}</span>
                                </div>

                                <div class="flex items-center gap-1.5">
                                    <button 
                                        onclick="openModal('${loan.id}', '${loan.borrowers.name}', '${loan.borrowers.phone || ''}', '${loan.borrowers.email || ''}', '${loan.principal_amount}', '${loan.due_date}')"
                                        class="w-8 h-8 rounded-xl bg-cream-200 dark:bg-cozyDark-700 text-slate-600 dark:text-slate-300 hover:bg-cream-300 dark:hover:bg-cozyDark-600 flex items-center justify-center transition active:scale-95"
                                        title="View Details"
                                    >
                                        <i class="fa-solid fa-eye text-xs"></i>
                                    </button>
                                    <button 
                                        onclick="quickRemind('${loan.id}', '${loan.borrowers.name}')"
                                        class="w-8 h-8 rounded-xl bg-emerald-400 hover:bg-emerald-500 text-slate-900 font-bold flex items-center justify-center transition active:scale-95 shadow-sm"
                                        title="Send Quick Reminder"
                                    >
                                        <i class="fa-solid fa-bolt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error("Dashboard error:", err);
            }
        }

        function openModal(loanId, name, phone, email, amount, dueDate) {
            selectedLoanId = loanId;
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalPhone').innerText = phone || 'None';
            document.getElementById('modalEmail').innerText = email || 'None';
            document.getElementById('modalAmount').innerText = parseFloat(amount).toLocaleString();
            document.getElementById('modalDueDate').innerText = dueDate;
            
            const modal = document.getElementById('borrowerModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('borrowerModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            selectedLoanId = null;
        }

        async function quickRemind(loanId, borrowerName) {
            if (!confirm(`Send instant SMS & Email reminder to ${borrowerName}?`)) return;

            try {
                const response = await fetch(`/api/loans/${loanId}/send-reminder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel: 'both' })
                });

                const result = await response.json();
                alert(response.ok ? result.message : `Error: ${result.error}`);
            } catch (err) {
                alert(`Failed to send reminder: ${err.message}`);
            }
        }

        async function triggerManualReminder() {
            if (!selectedLoanId) return alert('No borrower selected.');
            const channel = document.getElementById('reminderChannel').value;

            try {
                const response = await fetch(`/api/loans/${selectedLoanId}/send-reminder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel })
                });

                const result = await response.json();
                alert(response.ok ? result.message : `Error: ${result.error}`);
            } catch (err) {
                alert(`Failed to send reminder: ${err.message}`);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
